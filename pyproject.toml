[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evodev"
version = "1.0.0"
description = "Self-Improving Developer Experience Layer for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "EvoDev Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "cryptography>=40.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "httpx>=0.24.0"
]

[project.scripts]
evodev = "evodev.cli.main:app"
evodev-mcp = "evodev.connectors.opencode_mcp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
